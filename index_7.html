<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Name That Note — Team Recorder Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,600&family=Space+Mono:wght@400;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1e2a24;
    --paper: #f1e6c8;
    --paper-2: #e9dcb8;
    --hole-red: #c33c2e;
    --hole-red-dark: #9c2f24;
    --brass: #b08d57;
    --ink-text: #2a2118;
    --success: #4c7a5e;
    --wrong: #a63a2e;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(176,141,87,0.10), transparent 55%),
      var(--ink);
    color: var(--paper);
    font-family:'Karla', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 48px;
  }

  .top{
    width:100%;
    max-width: 620px;
    display:flex;
    justify-content: flex-end;
  }

  .mute-btn{
    background: transparent;
    border: 1.5px solid var(--brass);
    color: var(--brass);
    font-family:'Space Mono', monospace;
    font-size: 12px;
    border-radius: 20px;
    padding: 7px 14px;
    cursor:pointer;
    letter-spacing:0.04em;
    transition: background 0.2s, color 0.2s;
  }
  .mute-btn:hover{ background: var(--brass); color: var(--ink); }

  .eyebrow{
    font-family:'Space Mono', monospace;
    letter-spacing:0.28em;
    text-transform:uppercase;
    font-size:11px;
    color: var(--brass);
    margin: 16px 0 6px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(30px, 6vw, 48px);
    margin: 0 0 4px;
    text-align:center;
    color: var(--paper);
    letter-spacing: -0.01em;
  }

  .sub{
    font-size:14px;
    color: var(--paper-2);
    opacity:0.75;
    margin-bottom: 22px;
    text-align:center;
    max-width: 460px;
  }

  #app{
    width:100%;
    max-width: 620px;
  }

  .card{
    background: var(--paper);
    color: var(--ink-text);
    border-radius: 14px;
    padding: 26px 26px 22px;
    width: 100%;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55), 0 2px 0 var(--brass) inset;
    position: relative;
    margin-bottom: 18px;
  }

  .panel-title{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    margin: 0 0 14px;
    text-align:center;
  }

  /* --- Team setup --- */
  .team-row{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom: 10px;
  }
  .team-row input{
    flex:1;
    font-family:'Karla', sans-serif;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--brass);
    background: #fffdf6;
    color: var(--ink-text);
  }
  .team-row input:focus{ outline: 2px solid var(--hole-red); outline-offset: 1px; }
  .play-btn{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size: 13px;
    background: var(--hole-red);
    color: #fdf3ea;
    border:none;
    padding: 11px 16px;
    border-radius: 8px;
    cursor:pointer;
    white-space:nowrap;
    letter-spacing:0.03em;
  }
  .play-btn:hover{ background: var(--hole-red-dark); }

  /* --- Highscores --- */
  .hs-list{ list-style:none; margin:0; padding:0; }
  .hs-list li{
    display:flex;
    justify-content:space-between;
    padding: 8px 4px;
    border-bottom: 1px dashed rgba(42,33,24,0.2);
    font-family:'Space Mono', monospace;
    font-size: 14px;
  }
  .hs-list li:last-child{ border-bottom:none; }
  .hs-rank{ opacity:0.5; margin-right:8px; }
  .hs-empty{ text-align:center; opacity:0.5; font-size:13px; padding: 10px 0; }

  /* --- Round header --- */
  .round-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 16px;
    font-family:'Space Mono', monospace;
  }
  .round-team{ font-size: 15px; font-weight:700; color: var(--hole-red-dark); }
  .round-stat{ display:flex; gap:16px; align-items:center; }
  .timer{ font-size: 20px; font-weight:700; }
  .timer.low{ color: var(--wrong); }
  .score-live{ font-size: 15px; }

  .img-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    height: 230px;
    margin-bottom: 20px;
  }
  .img-wrap img{
    max-height: 100%;
    max-width: 160px;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.18));
  }

  .prompt{
    text-align:center;
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size: 17px;
    margin-bottom: 16px;
  }

  .options{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .opt{
    font-family:'Space Mono', monospace;
    font-size: 17px;
    font-weight: 700;
    padding: 14px 4px;
    border-radius: 8px;
    border: 1.5px solid var(--brass);
    background: #fffdf6;
    color: var(--ink-text);
    cursor:pointer;
    transition: transform 0.12s ease, background 0.2s, border-color 0.2s, color 0.2s;
  }
  .opt:hover:not(:disabled){ transform: translateY(-2px); border-color: var(--hole-red); }
  .opt:disabled{ cursor:default; }
  .opt.correct{ background: var(--success); border-color: var(--success); color:#fdf9ee; }
  .opt.wrong{ background: var(--wrong); border-color: var(--wrong); color:#fdf9ee; animation: shake 0.3s; }
  .opt.reveal{ background: var(--success); border-color: var(--success); color:#fdf9ee; }

  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-5px); }
    75%{ transform: translateX(5px); }
  }

  .feedback{
    min-height: 20px;
    text-align:center;
    font-family:'Space Mono', monospace;
    font-size: 13px;
    margin-top: 12px;
  }

  /* --- End screen --- */
  .end{ text-align:center; }
  .score{
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight:700;
    font-size: 44px;
    margin: 6px 0 2px;
  }
  .score-label{
    font-family:'Space Mono', monospace;
    font-size: 12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    opacity:0.6;
    margin-bottom: 16px;
  }
  .btn-row{ display:flex; gap:10px; justify-content:center; }
  .replay{
    font-family:'Space Mono', monospace;
    font-weight:700;
    background: var(--hole-red);
    color: #fdf3ea;
    border:none;
    padding: 13px 22px;
    border-radius: 8px;
    font-size:14px;
    cursor:pointer;
  }
  .replay.secondary{
    background: transparent;
    border: 1.5px solid var(--brass);
    color: var(--ink-text);
  }
  .replay:hover{ filter: brightness(0.92); }

  /* --- Staff (bottom, persistent) --- */
  .staff-panel{
    background: rgba(241,230,200,0.06);
    border: 1px solid rgba(176,141,87,0.35);
    border-radius: 14px;
    padding: 14px 10px;
    width: 100%;
    max-width: 620px;
  }
  .staff-title{
    font-family:'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 8px;
    text-align:center;
  }
  .staff-scroll{
    overflow-x: auto;
    overflow-y: hidden;
  }
  svg.staff{ height: 96px; display:block; }
  .staff-line{ stroke: var(--brass); stroke-width:1.2; opacity:0.55; }
  .note-head{ transition: transform 0.35s cubic-bezier(.2,1.4,.4,1), opacity 0.3s; }
  .note-stem{ stroke-width:1.5; }

  footer{
    margin-top: 26px;
    font-family:'Space Mono', monospace;
    font-size: 11px;
    color: var(--paper-2);
    opacity:0.45;
    text-align:center;
  }
</style>
</head>
<body>

  <div class="top">
    <button class="mute-btn" id="muteBtn">♪ Music: On</button>
  </div>

  <div class="eyebrow">Soprano Recorder</div>
  <h1>Name That Note</h1>
  <div class="sub">8 teams. 2 minutes each. +10 for every correct note, −5 for a miss.</div>

  <div id="app"></div>

  <div class="staff-panel">
    <div class="staff-title">This Round's Notes</div>
    <div class="staff-scroll">
      <svg class="staff" id="staffSvg" viewBox="0 0 200 96" preserveAspectRatio="xMinYMid meet">
        <line class="staff-line" x1="0" y1="16" x2="10000" y2="16"/>
        <line class="staff-line" x1="0" y1="32" x2="10000" y2="32"/>
        <line class="staff-line" x1="0" y1="48" x2="10000" y2="48"/>
        <line class="staff-line" x1="0" y1="64" x2="10000" y2="64"/>
        <line class="staff-line" x1="0" y1="80" x2="10000" y2="80"/>
        <g id="noteLayer"></g>
      </svg>
    </div>
  </div>

  <footer>9 fingerings · A B C D E F G C′ D′</footer>

<script>
const NOTES = ["A","B","C","D","E","F","G","C′","D′"];
const FREQS = [440.00,493.88,523.25,587.33,659.25,698.46,783.99,1046.50,1174.66]; // A4..D6
const QUESTIONS = NOTES.map((note, i) => ({ note, img: `images/${i+1}.png`, freq: FREQS[i] }));
const ROUND_SECONDS = 120;
const MAX_HIGHSCORES = 10;

let teams = Array.from({length:8}, (_,i)=> `Team ${i+1}`);
let highscores = []; // {name, score} — most recent first, capped at 10, resets on tab close

let screen = 'setup'; // 'setup' | 'playing' | 'end'
let currentTeam = '';
let score = 0;
let timeLeft = ROUND_SECONDS;
let timerHandle = null;
let roundQueue = [];
let roundActive = false;
let notesShown = 0; // count of notes drawn on staff this round

const app = document.getElementById('app');
const noteLayer = document.getElementById('noteLayer');
const staffSvg = document.getElementById('staffSvg');
const staffScroll = document.querySelector('.staff-scroll');
const muteBtn = document.getElementById('muteBtn');

/* ---------------- Audio: procedural SFX + ambient pad (no external files) ---------------- */
let actx = null;
let musicOn = true;
let musicNodes = null;
let musicStarted = false;

function ensureAudio(){
  if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state === 'suspended') actx.resume();
}

function playNoteTone(freq){
  ensureAudio();
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  const osc2 = actx.createOscillator();
  const gain = actx.createGain();
  const filter = actx.createBiquadFilter();

  osc.type = 'sine'; osc2.type = 'triangle';
  osc.frequency.setValueAtTime(freq, t0);
  osc2.frequency.setValueAtTime(freq, t0);
  filter.type = 'lowpass'; filter.frequency.setValueAtTime(3200, t0);

  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.03);
  gain.gain.exponentialRampToValueAtTime(0.14, t0 + 0.18);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);

  osc.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(actx.destination);
  osc.start(t0); osc2.start(t0);
  osc.stop(t0 + 0.6); osc2.stop(t0 + 0.6);
}

function startAmbientMusic(){
  if(musicStarted) return;
  ensureAudio();
  musicStarted = true;

  const master = actx.createGain();
  master.gain.setValueAtTime(0, actx.currentTime);
  master.gain.linearRampToValueAtTime(musicOn ? 0.05 : 0, actx.currentTime + 3);
  master.connect(actx.destination);

  const padFilter = actx.createBiquadFilter();
  padFilter.type = 'lowpass'; padFilter.frequency.value = 900;
  padFilter.connect(master);

  const padFreqs = [220.00, 261.63, 329.63, 392.00, 440.00];
  const oscs = [];
  padFreqs.forEach((f, i) => {
    const o1 = actx.createOscillator();
    const o2 = actx.createOscillator();
    const g = actx.createGain();
    const lfo = actx.createOscillator();
    const lfoGain = actx.createGain();

    o1.type = 'sine'; o2.type = 'sine';
    o1.frequency.value = f; o2.frequency.value = f * 1.003;
    g.gain.value = 0.16;

    lfo.frequency.value = 0.06 + i * 0.015;
    lfoGain.gain.value = 0.08;
    lfo.connect(lfoGain); lfoGain.connect(g.gain);
    o1.connect(g); o2.connect(g); g.connect(padFilter);

    o1.start(); o2.start(); lfo.start();
    oscs.push(o1, o2, lfo);
  });
  musicNodes = { master, oscs };
}

function setMusicOn(on){
  musicOn = on;
  muteBtn.textContent = on ? '♪ Music: On' : '♪ Music: Off';
  if(musicNodes) musicNodes.master.gain.linearRampToValueAtTime(on ? 0.05 : 0, actx.currentTime + 0.6);
}

muteBtn.addEventListener('click', ()=>{
  ensureAudio(); startAmbientMusic(); setMusicOn(!musicOn);
});

/* ---------------- Helpers ---------------- */

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function nextQuestionIndex(){
  if(roundQueue.length === 0){
    roundQueue = shuffle(QUESTIONS.map((_,i)=>i));
  }
  return roundQueue.pop();
}

function fmtTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}

function addNoteToStaff(noteIndex, correct){
  const spacing = 42;
  const x = 20 + notesShown * spacing;
  notesShown++;

  const neededWidth = x + 40;
  staffSvg.setAttribute('viewBox', `0 0 ${Math.max(200, neededWidth)} 96`);
  staffSvg.style.width = Math.max(200, neededWidth) + 'px';

  const top = 12, bottom = 84;
  const y = bottom - (noteIndex/(NOTES.length-1)) * (bottom-top);
  const color = correct ? 'var(--success)' : 'var(--wrong)';

  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  const stem = document.createElementNS('http://www.w3.org/2000/svg','line');
  stem.setAttribute('class','note-stem');
  stem.setAttribute('x1', x+6); stem.setAttribute('x2', x+6);
  stem.setAttribute('y1', y); stem.setAttribute('y2', y-20);
  stem.setAttribute('stroke', color);

  const head = document.createElementNS('http://www.w3.org/2000/svg','ellipse');
  head.setAttribute('class','note-head');
  head.setAttribute('cx', x); head.setAttribute('cy', y);
  head.setAttribute('rx', 6); head.setAttribute('ry', 4.6);
  head.setAttribute('fill', color);
  head.setAttribute('opacity', 0);
  head.style.transform = 'translateY(-10px) scale(0.4)';
  head.style.transformOrigin = `${x}px ${y}px`;

  g.appendChild(stem); g.appendChild(head);
  noteLayer.appendChild(g);

  requestAnimationFrame(()=>{
    head.setAttribute('opacity', 1);
    head.style.transform = 'translateY(0) scale(1)';
  });

  requestAnimationFrame(()=>{ staffScroll.scrollLeft = staffScroll.scrollWidth; });
}

function clearStaff(){
  noteLayer.innerHTML = '';
  notesShown = 0;
  staffSvg.setAttribute('viewBox', '0 0 200 96');
  staffSvg.style.width = '200px';
}

function pushHighscore(name, finalScore){
  highscores.unshift({ name, score: finalScore });
  if(highscores.length > MAX_HIGHSCORES) highscores.pop();
}

/* ---------------- Screens ---------------- */

function renderSetup(){
  screen = 'setup';
  clearTimer();

  const rows = teams.map((name, i)=>`
    <div class="team-row">
      <input type="text" value="${name.replace(/"/g,'&quot;')}" data-idx="${i}" placeholder="Team ${i+1}" maxlength="24">
      <button class="play-btn" data-idx="${i}">Play ▶</button>
    </div>
  `).join('');

  const hsItems = highscores.length
    ? highscores.map((h,i)=>`<li><span><span class="hs-rank">${i+1}.</span>${escapeHtml(h.name)}</span><span>${h.score}</span></li>`).join('')
    : `<div class="hs-empty">No rounds played yet this session.</div>`;

  app.innerHTML = `
    <div class="card">
      <div class="panel-title">Teams</div>
      ${rows}
    </div>
    <div class="card">
      <div class="panel-title">Recent Highscores</div>
      <ul class="hs-list">${highscores.length ? hsItems : ''}</ul>
      ${highscores.length ? '' : hsItems}
    </div>
  `;

  app.querySelectorAll('input[data-idx]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      teams[+e.target.dataset.idx] = e.target.value.trim() || `Team ${+e.target.dataset.idx+1}`;
    });
  });
  app.querySelectorAll('.play-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const idx = +e.target.dataset.idx;
      const inputEl = app.querySelector(`input[data-idx="${idx}"]`);
      teams[idx] = (inputEl.value.trim()) || `Team ${idx+1}`;
      ensureAudio(); startAmbientMusic();
      startRound(teams[idx]);
    });
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function startRound(teamName){
  screen = 'playing';
  currentTeam = teamName;
  score = 0;
  timeLeft = ROUND_SECONDS;
  roundQueue = [];
  roundActive = true;
  clearStaff();
  renderQuestion();
  startTimer();
}

function startTimer(){
  clearTimer();
  timerHandle = setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft <= 0){
      endRound();
    }
  }, 1000);
}

function clearTimer(){
  if(timerHandle){ clearInterval(timerHandle); timerHandle = null; }
}

function updateTimerDisplay(){
  const el = document.getElementById('timerVal');
  const scoreEl = document.getElementById('scoreVal');
  if(el){
    el.textContent = fmtTime(Math.max(0,timeLeft));
    el.classList.toggle('low', timeLeft <= 15);
  }
  if(scoreEl) scoreEl.textContent = score;
}

function renderQuestion(){
  const qi = nextQuestionIndex();
  const q = QUESTIONS[qi];

  app.innerHTML = `
    <div class="card">
      <div class="round-head">
        <div class="round-team">${escapeHtml(currentTeam)}</div>
        <div class="round-stat">
          <div class="score-live">Score: <b id="scoreVal">${score}</b></div>
          <div class="timer" id="timerVal">${fmtTime(timeLeft)}</div>
        </div>
      </div>
      <div class="img-wrap"><img src="${q.img}" alt="recorder fingering diagram"></div>
      <div class="prompt">Which note is this fingering?</div>
      <div class="options" id="opts"></div>
      <div class="feedback" id="fb">&nbsp;</div>
    </div>
  `;

  const opts = document.getElementById('opts');
  NOTES.forEach((label, ci)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = label;
    btn.addEventListener('click', ()=> handleAnswer(ci, qi, btn));
    opts.appendChild(btn);
  });
}

function handleAnswer(chosenIndex, correctIndex, btn){
  if(!roundActive) return;
  const allBtns = document.querySelectorAll('.opt');
  allBtns.forEach(b=> b.disabled = true);

  playNoteTone(FREQS[chosenIndex]);

  const isCorrect = chosenIndex === correctIndex;
  const fb = document.getElementById('fb');
  if(isCorrect){
    btn.classList.add('correct');
    score += 10;
    fb.textContent = '+10 — Correct!';
  } else {
    btn.classList.add('wrong');
    allBtns.forEach(b=>{ if(b.textContent === NOTES[correctIndex]) b.classList.add('reveal'); });
    score -= 5;
    fb.textContent = `−5 — that's ${NOTES[correctIndex]}.`;
    setTimeout(()=> playNoteTone(FREQS[correctIndex]), 320);
  }
  updateTimerDisplay();
  addNoteToStaff(correctIndex, isCorrect);

  setTimeout(()=>{
    if(roundActive && timeLeft > 0) renderQuestion();
  }, 550);
}

function endRound(){
  roundActive = false;
  clearTimer();
  timeLeft = 0;
  pushHighscore(currentTeam, score);
  renderEnd();
}

function renderEnd(){
  screen = 'end';
  app.innerHTML = `
    <div class="card end">
      <div class="score-label">Time's Up — ${escapeHtml(currentTeam)}</div>
      <div class="score">${score}</div>
      <div class="sub" style="margin:6px 0 20px;">points this round</div>
      <div class="btn-row">
        <button class="replay" id="playAgainBtn">Play Again</button>
        <button class="replay secondary" id="backBtn">Back to Teams</button>
      </div>
    </div>
  `;
  document.getElementById('playAgainBtn').addEventListener('click', ()=> startRound(currentTeam));
  document.getElementById('backBtn').addEventListener('click', renderSetup);
}

renderSetup();
</script>
</body>
</html>
